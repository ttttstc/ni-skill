name: ni-work-tutor-transcribe

on:
  push:
    branches:
      - work/ni-work-tutor-build-20260922
    paths:
      - 'skills/ni-work-tutor/evidence/posts.jsonl'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ASR and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install faster-whisper playwright requests
          if ! command -v google-chrome >/dev/null 2>&1; then
            python -m playwright install --with-deps chromium
          fi

      - name: Transcribe shard
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          mkdir -p build/ni-work-tutor/transcripts
          python skills/ni-work-tutor/scripts/transcribe_shard.py \
            --posts skills/ni-work-tutor/evidence/posts.jsonl \
            --output build/ni-work-tutor/transcripts \
            --shard ${{ matrix.shard }} \
            --shards 8 \
            --model large-v3-turbo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ni-work-tutor-transcripts-${{ matrix.shard }}
          path: build/ni-work-tutor/
          if-no-files-found: warn

  aggregate:
    needs: transcribe
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ni-work-tutor-transcripts-*
          path: build/all
          merge-multiple: true

      - name: Verify transcript coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          posts = [
              json.loads(x) for x in
              Path("skills/ni-work-tutor/evidence/posts.jsonl").read_text(encoding="utf-8").splitlines()
              if x.strip()
          ]
          statuses = []
          for p in sorted(Path("build/all").glob("status-*.jsonl")):
              statuses += [json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]

          status_by_id = {str(x["content_id"]): x for x in statuses}
          video_ids = {str(x["content_id"]) for x in posts if x.get("kind") == "video"}
          ok_ids = {cid for cid, x in status_by_id.items() if x.get("status") == "ok"}
          failed_ids = {cid for cid, x in status_by_id.items() if x.get("status") == "failed"}
          missing_ids = sorted(video_ids - set(status_by_id))
          transcript_ids = {p.stem for p in Path("build/all/transcripts").glob("*.json")} if Path("build/all/transcripts").exists() else set()
          ok_without_file = sorted(ok_ids - transcript_ids)

          coverage = {
              "total_posts": len(posts),
              "video_posts": len(video_ids),
              "ok": len(ok_ids),
              "failed": len(failed_ids),
              "missing_status": len(missing_ids),
              "ok_without_transcript_file": len(ok_without_file),
              "failed_ids": sorted(failed_ids),
              "missing_ids": missing_ids,
              "ok_without_file_ids": ok_without_file,
          }
          Path("build/all/coverage.json").write_text(
              json.dumps(coverage, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(coverage, ensure_ascii=False, indent=2))
          if missing_ids or ok_without_file:
              raise SystemExit(2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ni-work-tutor-transcripts-all
          path: build/all/
          if-no-files-found: error
