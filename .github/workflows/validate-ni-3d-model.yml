name: Validate ni-3d-model

on:
  pull_request:
    paths:
      - "skills/ni-3d-model/**"
      - ".codex-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/validate-ni-3d-model.yml"
  push:
    branches:
      - main
    paths:
      - "skills/ni-3d-model/**"
      - ".codex-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/validate-ni-3d-model.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill contract
        run: python -m unittest discover -s skills/ni-3d-model/tests -v
